name: KRX Daily Screening Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "25 7 * * 1-5"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: krx-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KRX screening
        if: github.event_name != 'push'
        env:
          KRX_SCREEN_BASE_DIR: ${{ github.workspace }}
          KRX_USE_DART: ${{ secrets.KRX_USE_DART }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_TIMEZONE: Asia/Seoul
          MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/python
        run: python -m krx_screening.main

      - name: Verify screening outputs
        if: github.event_name != 'push'
        run: python scripts/verify_krx_outputs.py

      - name: Build Pages site
        if: github.event_name != 'push'
        run: python scripts/build_pages_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram notification
        if: github.event_name != 'push'
        env:
          KRX_SCREEN_BASE_DIR: ${{ github.workspace }}
          KRX_TELEGRAM_BOT_TOKEN: ${{ secrets.KRX_TELEGRAM_BOT_TOKEN }}
          KRX_TELEGRAM_CHAT_ID: ${{ secrets.KRX_TELEGRAM_CHAT_ID }}
          KRX_REPORT_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -z "$KRX_TELEGRAM_BOT_TOKEN" ] || [ -z "$KRX_TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi
          python scripts/send_krx_telegram.py
